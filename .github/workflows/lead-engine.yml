name: lead-engine

on:
  push:
    paths:
      - "northbeam-lead-engine/**"
      - ".github/workflows/lead-engine.yml"
  pull_request:
    paths:
      - "northbeam-lead-engine/**"
      - ".github/workflows/lead-engine.yml"

defaults:
  run:
    working-directory: northbeam-lead-engine

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "northbeam-lead-engine/uv.lock"
      - name: Install
        run: uv sync --frozen --extra dev
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy app scripts
      - name: Pytest
        run: uv run pytest -q
      - name: Evaluate
        run: uv run python scripts/evaluate.py
