name: Inbox Copilot Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'inbox-copilot/backend/**'
      - '.github/workflows/backend-inbox-copilot.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'inbox-copilot/backend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Указываем, что команды нужно выполнять в папке бэкенда
        working-directory: ./inbox-copilot/backend

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Check syntax with Ruff
      run: |
        pip install ruff
        ruff check .