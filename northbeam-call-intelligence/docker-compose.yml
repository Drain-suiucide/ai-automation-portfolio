# n8n in queue mode (PostgreSQL for n8n state, Redis for the execution queue, two workers)
# plus the call-intelligence service. Audio and call data live in ./data.
x-n8n: &n8n
  image: n8nio/n8n:latest
  environment: &n8n-env
    DB_TYPE: postgresdb
    DB_POSTGRESDB_HOST: postgres
    DB_POSTGRESDB_DATABASE: n8n
    DB_POSTGRESDB_USER: n8n
    DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    EXECUTIONS_MODE: queue
    QUEUE_BULL_REDIS_HOST: redis
    N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
    GENERIC_TIMEZONE: ${TZ:-UTC}
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_started}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: n8n
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  n8n:
    <<: *n8n
    ports: ["5678:5678"]
    volumes: [n8n_data:/home/node/.n8n]

  n8n-worker-1:
    <<: *n8n
    command: worker

  n8n-worker-2:
    <<: *n8n
    command: worker

  call-intelligence:
    build: .
    ports: ["8030:8030"]
    environment:
      NCI_ASR_PROVIDER: ${NCI_ASR_PROVIDER:-fixture}
      NCI_LLM_PROVIDER: ${NCI_LLM_PROVIDER:-fake}
      NCI_LLM_MODEL: ${NCI_LLM_MODEL:-}
      NCI_LLM_API_KEY: ${NCI_LLM_API_KEY:-}
      NCI_LLM_BASE_URL: ${NCI_LLM_BASE_URL:-}
      NCI_RETENTION_DAYS: ${NCI_RETENTION_DAYS:-30}
    volumes: ["./data:/srv/data"]

volumes:
  pgdata:
  n8n_data:
