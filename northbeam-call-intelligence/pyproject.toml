[project]
name = "northbeam-call-intelligence"
version = "0.1.0"
description = "Call audio to CRM-safe actions: consent gate, PII redaction, evidence-grounded extraction, deterministic policies."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501", "B008"]  # B008: FastAPI's Form()/File() defaults are the framework's idiom

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
